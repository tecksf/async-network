# Network stack configuration.
#
# Every line is a key=value pair, '#' starts a comment. The same keys can be given on
# the command line as name=value pairs, e.g.
#     ./async_network config=config/network.conf interface=eth0 ip=192.168.1.10
# A command line value overrides the value of this file.

# ---- logging ----
# Every logger owns a dedicated asynchronous thread pool, so its queue and writer threads
# are configured independently. Available targets: console, file or both.
#
# Logger "runtime": coroutine scheduler and network protocol stack.
log.runtime.level=debug
log.runtime.enabled=1
log.runtime.target=console
# Used when target is file or both. An empty path selects logs/runtime.log.
# max_size=0 disables rotation and uses a plain, appended file.
log.runtime.file.path=logs/runtime.log
log.runtime.file.max_size=10485760
log.runtime.file.max_files=3
log.runtime.file.rotate_on_open=0
log.runtime.queue_size=8192
log.runtime.threads=1

# Logger "user": application code. Use a file path that differs from the runtime one:
# two independent file sinks writing the same file would corrupt each other.
log.user.level=info
log.user.enabled=1
log.user.target=console
log.user.file.path=logs/user.log
log.user.file.max_size=10485760
log.user.file.max_files=3
log.user.file.rotate_on_open=0
log.user.queue_size=8192
log.user.threads=1

# ---- physical / link ----
# NIC used for raw packet capture.
interface=eth0
# Host IPv4 address of that NIC.
ip=192.168.1.100
# Size of one frame buffer slot, must be >= ethernet_mtu + 14 and <= 1536.
block_size=1536
# Maximum Ethernet payload (without the 14 byte header).
ethernet_mtu=1480
# Seconds an ARP mapping stays usable without being confirmed by a new ARP packet.
arp.entry_timeout=300
# Seconds between two lazy ARP table cleanups.
arp.cleanup_interval=1

# ---- internet ----
# TTL of the IPv4 packets we send.
ipv4.ttl=64
# ARP resolution attempts before an outbound packet is dropped.
ipv4.arp_retry=5
# Validate the header checksum of an inbound IPv4 packet. Set it to 0 (=false/no/off) to skip
# the check, which is only meant for debugging: a corrupted header then reaches the transport layer.
ipv4.checksum_check=on

# ---- tcp ----
# Advertised receive window.
tcp.window_size=65535
# Advertised MSS, 0 means "derive from the MTU".
tcp.mss=0
# Smallest MSS we accept.
tcp.min_mss=536
# SYN flood mitigation: answer every SYN with a stateless SYN cookie instead of allocating a
# half-open session. Disabled by default, enable it with tcp.syn_cookie=1 (=true/yes/on).
tcp.syn_cookie=0
# The stateless handshake encodes the peer MSS into the low bits of the SYN cookie.
tcp.mss_cookie_step=4
tcp.mss_cookie_bits=8
# Length of a SYN cookie time slot in seconds.
tcp.syn_cookie_interval=64
# Seconds a handshaken but not accepted session may sit in the accept queue.
tcp.accept_timeout=30
# Upper bound of the accept queue.
tcp.max_accept_backlog=128
# 2 * max_segment_lifetime is the time a session stays in TimeWait.
tcp.max_segment_lifetime=30
# First interval and upper bound of zero window probing, in seconds.
tcp.persist_probe_initial_interval=1
tcp.persist_probe_max_interval=60
# Retransmission policy.
tcp.max_retransmissions=15
tcp.initial_rto_ms=1000
tcp.max_rto_ms=120000
# Seconds between two lazy cleanups of the accept queue.
tcp.cleanup_interval=1
# Seconds between two "segment dropped" log lines.
tcp.drop_log_interval=1
# Validate the checksum of an inbound TCP segment. Set it to 0 (=false/no/off) to skip the check,
# which is only meant for debugging: a corrupted segment then reaches the session state machine.
tcp.checksum_check=on
